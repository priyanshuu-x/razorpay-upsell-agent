<!DOCTYPE html>
<html>
<head>
  <title>Razorpay Test Checkout</title>
</head>
<body>
  <h2>Razorpay Test Checkout</h2>

  <label for="order-id-input">Order ID:</label>
  <input type="text" id="order-id-input" placeholder="order_xxxxxxxxxxxx" size="30">
  <br><br>
  <button id="pay-btn">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.getElementById('pay-btn').onclick = function () {
      var orderId = document.getElementById('order-id-input').value.trim();

      if (!orderId) {
        alert("Please paste an order ID first.");
        return;
      }

      var options = {
        "key": "rzp_test_TUsHWK6Y3OZeu6",  
        "order_id": orderId,            
        "name": "Test Merchant",
        "description": "Buildathon test payment",
        "handler": function (response) {
          alert("Payment successful! Payment ID: " + response.razorpay_payment_id);
          console.log(response);
        },
        "theme": {
          "color": "#3399cc"
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    };
  </script>
</body>
</html>
